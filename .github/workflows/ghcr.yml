---
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: "Build container image: sarracenia"

on:
  push:
    branches:
      - stable
      - development

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sarracenia

jobs:
  # Push image to GitHub Packages.
  # See also https://docs.docker.com/docker-hub/builds/
  push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          # need full git history to get tags
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # all images get tagged with latest
          # images built from the stable branch get tagged stable
          # images built from the stable branch also get tagged with their version number
          # images built from the development branch gets tagged development
          tags: |
            type=raw,value=latest
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/stable' }}
            type=semver,pattern={{version}},enable=${{ github.ref == 'refs/heads/stable' }}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/development' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
